interface:
  display_name: "Scholar PPT CN"
  short_description: "Chinese academic PPT planning, samples, and editable decks"
  default_prompt: "Use $scholar-ppt-cn to create a Chinese academic PPT from my materials and visual reference, or reconstruct a flattened slide image into a meaningfully editable PPTX. Before any new-deck, image-reference reconstruction, approved-mockup expansion, or broad-redesign production, show a plain-language production-path summary and wait when material decisions or long-run authorization are unclear. Extract Template DNA as the visual-consistency layer for new-deck work, preserve reusable native PPTX visual assets when I want the same source deck continued, use source text and data as content truth, preserve complete visual assets when their internals are not reliably recoverable, and let scholar-ppt-cn autonomously design scientific content-page layouts unless I explicitly request a source layout. Build the required planning artifacts, preserve scientific evidence, render the final deck, and run deterministic QA."
