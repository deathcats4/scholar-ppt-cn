interface:
  display_name: "Scholar PPT CN"
  short_description: "Chinese academic PPT planning, samples, and editable decks"
  default_prompt: "Use $scholar-ppt-cn to create a Chinese academic PPT. Preserve the v3.3.1 workflow: production planning table, mockup family + variants blueprint, then either representative image-model full-slide samples, an explicitly requested full-deck per-slide image-model route, or template-direct editable PPTX. Use the bundled reference template when I provide no template. Apply the v3.4 quality layer for scientific figures, role-based Microsoft YaHei typography, default PptxGenJS generation for new decks, rendered review, and final deterministic PPTX QA. Keep body font-size requirements aligned with v3.3.1: do not enforce a universal body-point floor, and treat tiny body text or automatic shrinking as readability issues for review. Re-inject the fixed academic image-model constraints on every generation call, and do not carry commercial-course icons, prohibited literature-report labels, or image-model-created mechanism graphics into editable reconstruction."
