name: validate

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate project fixture
        run: python scripts/validate_project.py tests/fixtures/project-valid.json
      - name: Lint Skill package
        run: python scripts/lint_skill.py .
      - name: Build deterministic package
        run: python scripts/package_skill.py --version ci

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install fixed PPTX runtime dependencies
        run: python -m pip install -r requirements-runtime.txt
      - name: Run runtime build tests
        run: python -m unittest tests.test_build_deck -v
